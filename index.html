<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>문제풀이 공유 보드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --accent:#5b6cff;
    --accent-dark:#4351d8;
    --pink:#ff6b8b;
    --bg-top:#dfe6ff;
    --bg-bottom:#ffe3ef;
    --card-bg:#ffffff;
    --text:#2b2d3a;
    --muted:#8a8fa3;
    --radius:16px;
    --shadow:0 6px 20px rgba(40,44,80,.12);
    --shadow-lg:0 20px 60px rgba(20,20,40,.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}

  .lock-overlay{
    position:fixed; inset:0; z-index:9999;
    background:linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .lock-overlay.hidden{ display:none; }
  .lock-panel{
    background:var(--card-bg); border-radius:22px; box-shadow:var(--shadow-lg);
    padding:40px 32px 32px; width:100%; max-width:340px; text-align:center;
  }
  .lock-icon{ font-size:38px; margin-bottom:10px; }
  .lock-panel h2{ margin:0 0 6px; font-size:19px; font-weight:800; }
  .lock-panel p.lock-sub{ margin:0 0 22px; font-size:13px; color:var(--muted); }
  .lock-input{
    width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid #e3e5ef;
    font-size:20px; letter-spacing:6px; text-align:center; outline:none; margin-bottom:14px;
    font-family:inherit;
  }
  .lock-input:focus{ border-color:var(--accent); }
  .lock-submit-btn{
    width:100%; padding:12px; border:none; border-radius:12px; cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--pink)); color:#fff;
    font-size:15px; font-weight:700;
  }
  .lock-submit-btn:hover{ filter:brightness(1.05); }
  .lock-error{ color:var(--pink); font-size:13px; margin:12px 0 0; font-weight:600; }
  .lock-error.hidden{ display:none; }
  @keyframes lockShake{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-8px);} 40%,60%{transform:translateX(8px);} }
  .lock-panel.shake{ animation:lockShake .5s; }
  .relock-btn{ font-size:12.5px; }
  body{
    margin:0;
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.55), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(255,255,255,.35), transparent 50%),
      linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    background-attachment:fixed;
    height:100%;
    overflow:hidden;
  }

  /* ---- setup banner ---- */
  #setupBanner{
    position:fixed; top:0; left:0; right:0; z-index:500;
    background:#3a2a12; color:#ffe8b8; font-size:13px; padding:10px 16px;
    text-align:center; line-height:1.6;
  }
  #setupBanner code{ background:rgba(255,255,255,.15); padding:1px 6px; border-radius:5px; }

  /* ---- layout ---- */
  .app-layout{ display:flex; align-items:stretch; height:100vh; }
  .sidebar{
    width:260px; flex-shrink:0; height:100%;
    background:rgba(255,255,255,.6); backdrop-filter:blur(8px);
    border-right:1px solid rgba(255,255,255,.7);
    padding:20px 14px 40px;
    overflow-y:auto;
  }
  .sidebar-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .sidebar-header h2{ font-size:14px; margin:0; color:#555; }
  .add-btn-sm{
    background:var(--accent); color:#fff; border:none; border-radius:8px;
    padding:5px 10px; font-size:12px; cursor:pointer; font-family:inherit; font-weight:600;
  }
  .add-btn-sm:hover{ background:var(--accent-dark); }
  .year-block{ margin-bottom:6px; }
  .year-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:7px 8px; border-radius:8px; font-weight:700; font-size:13.5px; color:#333;
    cursor:grab;
  }
  .year-row .year-actions{ display:flex; gap:2px; }
  .mini-btn{
    background:none; border:none; cursor:pointer; color:var(--muted); font-size:13px;
    padding:2px 5px; border-radius:6px; line-height:1;
  }
  .mini-btn:hover{ background:rgba(255,107,139,.15); color:var(--pink); }
  .lecture-list{ margin-left:8px; margin-bottom:6px; }
  .lecture-block{ margin-bottom:4px; }
  .lecture-header-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 8px 6px 6px; font-weight:600; font-size:12.5px; color:#444;
    cursor:grab;
  }
  .lecture-title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
  .session-list{ margin-left:10px; margin-bottom:4px; }
  .session-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:7px 10px; border-radius:8px; font-size:13px; color:#555;
    cursor:pointer; margin-bottom:2px;
  }
  .session-row:hover{ background:rgba(91,108,255,.1); }
  .session-row.active{ background:linear-gradient(135deg, var(--accent), var(--pink)); color:#fff; font-weight:600; }
  .session-row .mini-btn{ color:inherit; opacity:.65; }
  .session-row.active .mini-btn:hover{ background:rgba(255,255,255,.25); color:#fff; }
  .session-row .mini-btn:hover{ opacity:1; }
  .year-row.dragging, .lecture-header-row.dragging, .session-row.dragging, .card.dragging, .list-column.dragging{ opacity:.4; }
  .year-row.drag-over, .lecture-header-row.drag-over, .session-row.drag-over{
    outline:2px dashed var(--accent); outline-offset:1px;
  }
  .card.drag-over{ outline:3px dashed var(--accent); outline-offset:2px; }
  .session-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
  .row-actions{ display:flex; gap:2px; flex-shrink:0; }
  .year-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty-tree-hint{ font-size:12px; color:var(--muted); padding:6px 8px; line-height:1.6; }
  .hamburger-btn{ display:none; background:none; border:none; font-size:22px; cursor:pointer; color:var(--text); margin-right:8px; padding:2px 4px; }
  .sidebar-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:140; }

  @media (max-width:860px){
    .sidebar{
      position:fixed; left:0; top:0; height:100vh; z-index:150;
      transform:translateX(-100%); transition:transform .2s ease; box-shadow:var(--shadow-lg);
      overflow-y:auto;
    }
    .sidebar.open{ transform:translateX(0); }
    .hamburger-btn{ display:inline-block; }
  }

  .main-area{ flex:1; min-width:0; height:100%; display:flex; flex-direction:column; overflow:hidden; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 28px 10px; max-width:1400px; margin:0 auto; width:100%;
    flex-shrink:0;
  }
  .brand{ display:flex; align-items:center; gap:6px; min-width:0; }
  .brand h1{ font-size:21px; margin:0; font-weight:800; letter-spacing:-.3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .header-actions{ display:flex; align-items:center; gap:14px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; }
  .link-btn{
    background:none; border:none; color:var(--muted); font-size:12.5px; cursor:pointer;
    text-decoration:underline; padding:4px;
  }
  .link-btn:hover{ color:var(--pink); }
  .link-btn:disabled{ opacity:.4; cursor:not-allowed; text-decoration:none; }
  .admin-status{
    font-size:12px; font-weight:700; color:#2f9e5c; background:rgba(47,158,92,.12);
    padding:4px 10px; border-radius:999px; white-space:nowrap;
  }

  /* ---- Viewer mode: hide every write-capable control unless signed in as admin ---- */
  body:not(.admin-mode) .add-btn-sm,
  body:not(.admin-mode) .mini-btn,
  body:not(.admin-mode) .drag-handle,
  body:not(.admin-mode) .list-drag-handle,
  body:not(.admin-mode) .list-delete-btn,
  body:not(.admin-mode) .list-add-btn,
  body:not(.admin-mode) .add-list-column,
  body:not(.admin-mode) .delete-btn,
  body:not(.admin-mode) .fab,
  body:not(.admin-mode) #clearAllBtn,
  body:not(.admin-mode) #rotateLeftBtn,
  body:not(.admin-mode) #rotateRightBtn,
  body:not(.admin-mode) #scanEffectBtn,
  body:not(.admin-mode) #drawModeBtn,
  body:not(.admin-mode) #eraserModeBtn,
  body:not(.admin-mode) #undoBtn,
  body:not(.admin-mode) #resetOrigBtn,
  body:not(.admin-mode) #penOptions,
  body:not(.admin-mode) #lbEditRow,
  body:not(.admin-mode) .lb-sep{
    display:none !important;
  }
  .count-badge{
    font-size:12.5px; color:var(--accent-dark); background:rgba(91,108,255,.12);
    padding:5px 12px; border-radius:999px; font-weight:600; white-space:nowrap;
  }

  #boardSubtitle{
    max-width:1400px; margin:-6px auto 0; padding:0 28px 4px; font-size:13px; color:var(--muted);
    width:100%; flex-shrink:0;
  }

  .board{
    margin:10px 0 0; padding:10px 24px 20px;
    display:flex; flex-direction:row; align-items:stretch; gap:18px;
    overflow-x:auto; overflow-y:hidden;
    flex:1; min-height:0;
  }
  @media (max-width:520px){ .board{ padding:10px 12px 20px; gap:12px; } }

  .list-column{
    flex:0 0 300px; width:300px; background:rgba(20,22,40,.035); border-radius:18px;
    display:flex; flex-direction:column; height:100%; min-height:120px;
    transition:outline .12s ease;
  }
  @media (max-width:520px){ .list-column{ flex:0 0 82vw; width:82vw; } }
  .list-column.drag-over-list{ outline:3px dashed var(--accent); outline-offset:-3px; }
  .list-header{ display:flex; align-items:center; gap:6px; padding:12px 12px 8px; }
  .list-title{
    flex:1; min-width:0; font-weight:700; font-size:14.5px; outline:none;
    word-break:break-word; padding:3px 6px; border-radius:7px;
  }
  .list-title:focus{ background:rgba(255,255,255,.7); box-shadow:0 0 0 2px var(--accent); }
  .list-title.unassigned-title{ color:var(--muted); cursor:default; }
  .list-count{
    font-size:11px; color:var(--muted); background:rgba(0,0,0,.06);
    padding:2px 8px; border-radius:999px; flex-shrink:0; font-weight:600;
  }
  .list-drag-handle{ cursor:grab; color:var(--muted); font-size:15px; padding:2px 5px; user-select:none; flex-shrink:0; }
  .list-drag-handle:active{ cursor:grabbing; }
  .list-delete-btn{ flex-shrink:0; }
  .list-cards{
    flex:1; overflow-y:auto; overflow-x:hidden; min-height:60px;
    padding:2px 10px 6px; display:flex; flex-direction:column; gap:14px;
  }
  .list-cards.drag-over-cards{ background:rgba(91,108,255,.06); border-radius:10px; }
  .list-empty-hint{
    text-align:center; color:var(--muted); font-size:12.5px; padding:22px 10px;
    line-height:1.6; border:1.5px dashed rgba(0,0,0,.1); border-radius:12px; margin:4px 0;
  }
  .list-add-btn{
    margin:0 10px 12px; padding:9px; border:1.5px dashed rgba(0,0,0,.15); border-radius:10px;
    background:none; cursor:pointer; color:var(--muted); font-size:13px; font-weight:600; flex-shrink:0;
  }
  .list-add-btn:hover{ background:rgba(91,108,255,.08); color:var(--accent-dark); border-color:var(--accent); }
  .add-list-column{ flex:0 0 220px; align-self:flex-start; }
  @media (max-width:520px){ .add-list-column{ flex:0 0 70vw; } }
  .add-list-btn{
    width:100%; padding:14px; border:1.5px dashed rgba(0,0,0,.18); border-radius:16px;
    background:none; cursor:pointer; color:var(--muted); font-weight:700; font-size:14px;
  }
  .add-list-btn:hover{ background:rgba(91,108,255,.08); color:var(--accent-dark); border-color:var(--accent); }

  .card{
    background:var(--card-bg); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden;
    display:flex; flex-direction:column; animation:pop .25s ease; flex-shrink:0;
  }
  @keyframes pop{ from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:none;} }

  .card-title{ font-weight:700; font-size:16px; padding:14px 16px 8px; outline:none; word-break:break-word; }
  .card-title.is-empty:before{ content:attr(data-placeholder); color:var(--muted); font-weight:500; }
  .card-img-wrap{ width:100%; background:#eef0f7; cursor:zoom-in; }
  .card-img{ width:100%; display:block; }
  .card-answer{
    padding:10px 16px 4px; font-size:14px; line-height:1.5; color:#4a4d5c;
    outline:none; min-height:20px; word-break:break-word;
    border-top:1px dashed #eceef5; margin-top:4px;
  }
  .card-answer.is-empty:before{ content:attr(data-placeholder); color:var(--muted); }
  .card-footer{ display:flex; align-items:center; justify-content:space-between; padding:8px 10px 12px; }
  .drag-handle{ cursor:grab; color:var(--muted); font-size:16px; padding:4px 8px; user-select:none; }
  .drag-handle:active{ cursor:grabbing; }
  .icon-btn{
    border:none; background:none; cursor:pointer; font-size:15px; padding:6px 8px;
    border-radius:8px; color:var(--muted); line-height:1;
  }
  .icon-btn:hover{ background:rgba(255,107,139,.12); color:var(--pink); }

  .empty-state, .board-placeholder{ text-align:center; color:var(--muted); padding:80px 20px; font-size:15px; width:100%; }
  .empty-state span, .board-placeholder span{ display:block; font-size:40px; margin-bottom:10px; }

  .fab{
    position:fixed; right:28px; bottom:28px; width:60px; height:60px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--pink)); color:#fff; font-size:30px;
    border:none; cursor:pointer; box-shadow:0 10px 25px rgba(91,108,255,.45);
    display:flex; align-items:center; justify-content:center; transition:transform .15s ease; z-index:50;
  }
  .fab:hover{ transform:scale(1.06) rotate(90deg); }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,20,35,.55); display:flex; align-items:center;
    justify-content:center; z-index:100; padding:16px; backdrop-filter:blur(2px);
  }
  .hidden{ display:none !important; }

  .modal-panel{
    background:#fff; border-radius:20px; width:100%; max-width:480px; max-height:92vh;
    overflow-y:auto; box-shadow:var(--shadow-lg); padding:22px 22px 20px;
  }
  .modal-panel h2{ margin:0 0 16px; font-size:19px; }
  .field-label{ font-size:12.5px; font-weight:700; color:var(--muted); margin:14px 0 6px; display:block; }
  .text-input, .textarea-input{
    width:100%; border:1.5px solid #e7e8f2; border-radius:12px; padding:10px 12px;
    font-family:inherit; font-size:14px; resize:vertical; outline:none;
  }
  .text-input:focus, .textarea-input:focus{ border-color:var(--accent); }

  .dropzone{
    border:2px dashed #d3d6ea; border-radius:14px; padding:30px 14px; text-align:center;
    color:var(--muted); cursor:pointer; font-size:14px; transition:.15s;
  }
  .dropzone.dragover{ border-color:var(--accent); background:rgba(91,108,255,.06); color:var(--accent-dark); }
  .dropzone .big{ font-size:30px; display:block; margin-bottom:6px; }

  .preview-wrap{ position:relative; }
  .preview-wrap img{ width:100%; border-radius:14px; display:block; max-height:280px; object-fit:contain; background:#f2f2f7; }
  .change-photo-btn{
    margin-top:8px; background:none; border:none; color:var(--accent-dark); font-size:12.5px;
    cursor:pointer; text-decoration:underline; padding:2px;
  }

  .checkbox-row{ display:flex; align-items:center; gap:8px; margin-top:14px; font-size:13.5px; color:#555; }
  .checkbox-row input{ width:16px; height:16px; accent-color:var(--accent); }

  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .btn{ border:none; border-radius:11px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-ghost{ background:#f1f2f8; color:#555; }
  .btn-ghost:hover{ background:#e6e7f2; }
  .btn-primary{ background:linear-gradient(135deg, var(--accent), var(--pink)); color:#fff; }
  .btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-primary:not(:disabled):hover{ filter:brightness(1.05); }

  /* ---- Lightbox ---- */
  .lightbox-overlay{ position:fixed; inset:0; background:rgba(10,10,18,.9); z-index:200; display:flex; flex-direction:column; }
  .lightbox-top{ display:flex; justify-content:space-between; align-items:center; padding:12px 18px; color:#fff; }
  .lightbox-top .close-btn{
    background:rgba(255,255,255,.12); border:none; color:#fff; width:34px; height:34px;
    border-radius:50%; font-size:18px; cursor:pointer;
  }
  .lightbox-top .close-btn:hover{ background:rgba(255,255,255,.25); }
  .lb-caption{ font-size:13px; color:#c9cbe0; }

  .lightbox-viewport{ flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; touch-action:none; position:relative; min-height:0; }
  #stageCanvas{
    max-width:92vw; max-height:60vh; width:auto; height:auto; background:#fff;
    box-shadow:0 10px 40px rgba(0,0,0,.5); cursor:grab; touch-action:none; transform-origin:center center;
  }
  #stageCanvas.drawing{ cursor:crosshair; }
  #stageCanvas.dragging{ cursor:grabbing; }

  .lb-controls{ position:relative; background:rgba(255,255,255,.06); border-top:1px solid rgba(255,255,255,.08); padding:12px 16px 16px; }
  .lb-toggle-btn{
    position:absolute; top:-15px; left:50%; transform:translateX(-50%);
    width:36px; height:16px; border-radius:8px 8px 0 0;
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.2); border-bottom:none;
    color:#fff; cursor:pointer; font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center;
    z-index:5;
  }
  .lb-toggle-btn:hover{ background:rgba(255,255,255,.3); }
  .lb-controls-body{ overflow:hidden; max-height:600px; opacity:1; transition:max-height .22s ease, opacity .18s ease; }
  .lb-controls.collapsed{ padding-top:6px; padding-bottom:6px; }
  .lb-controls.collapsed .lb-controls-body{ max-height:0; opacity:0; pointer-events:none; }
  .lb-row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; margin-bottom:10px; }
  .lb-row:last-child{ margin-bottom:0; }
  .lb-btn{
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); color:#fff;
    border-radius:10px; padding:8px 13px; font-size:13px; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .lb-btn:hover{ background:rgba(255,255,255,.2); }
  .lb-btn.active{ background:var(--accent); border-color:var(--accent); }
  .lb-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .lb-sep{ width:1px; height:22px; background:rgba(255,255,255,.18); margin:0 2px; }

  .slider-group{ display:flex; align-items:center; gap:6px; color:#dfe0f2; font-size:12.5px; }
  .slider-group input[type=range]{ accent-color:var(--pink); width:90px; }

  .pen-options{ display:flex; align-items:center; gap:8px; }
  .pen-swatch{ width:22px; height:22px; border-radius:50%; border:2px solid rgba(255,255,255,.6); cursor:pointer; }
  .pen-swatch.selected{ outline:2px solid #fff; outline-offset:2px; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:#d6d8ea; border-radius:8px; }
</style>
</head>
<body>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-panel" id="lockPanel">
    <div class="lock-icon">🔒</div>
    <h2>비밀번호를 입력하세요</h2>
    <p class="lock-sub">이 보드는 비밀번호로 보호되어 있어요.</p>
    <input type="password" id="lockPasswordInput" class="lock-input" inputmode="numeric" autocomplete="off" maxlength="20" placeholder="••••">
    <button class="lock-submit-btn" id="lockSubmitBtn">입장하기</button>
    <p class="lock-error hidden" id="lockError">비밀번호가 틀렸습니다.</p>
  </div>
</div>

<div id="setupBanner" class="hidden"></div>

<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>📁 강의 목록</h2>
      <button class="add-btn-sm" id="addYearBtn">+ 연도</button>
    </div>
    <div id="yearTree"></div>
  </aside>
  <div class="sidebar-backdrop hidden" id="sidebarBackdrop"></div>

  <div class="main-area">
    <header>
      <div class="brand">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="메뉴 열기">☰</button>
        <h1 id="boardTitle">📚 문제풀이 공유 보드</h1>
      </div>
      <div class="header-actions">
        <span class="count-badge" id="countBadge">0개의 게시물</span>

<script type="module">
  /* ---------------- Access lock (client-side password gate) ----------------
     이건 진짜 로그인/보안이 아니라, 아무나 링크를 열어도 화면이 안 보이게 막는
     "출입문" 정도예요. 페이지 소스나 개발자 도구를 볼 줄 아는 사람은 우회할 수
     있고, Firebase 보안 규칙이 열려 있으면 데이터 자체는 그대로 접근 가능해요.
  ========================================================================= */
  const SITE_PASSWORD = '2694';
  const LOCK_STORAGE_KEY = 'boardUnlocked_v1';
  const lockOverlay = document.getElementById('lockOverlay');
  const lockPanel = document.getElementById('lockPanel');
  const lockPasswordInput = document.getElementById('lockPasswordInput');
  const lockSubmitBtn = document.getElementById('lockSubmitBtn');
  const lockError = document.getElementById('lockError');

  function isUnlocked(){
    try{ return localStorage.getItem(LOCK_STORAGE_KEY) === 'yes'; }catch(e){ return false; }
  }
  function unlock(){
    try{ localStorage.setItem(LOCK_STORAGE_KEY, 'yes'); }catch(e){}
    lockOverlay.classList.add('hidden');
  }
  function relock(){
    try{ localStorage.removeItem(LOCK_STORAGE_KEY); }catch(e){}
    lockOverlay.classList.remove('hidden');
    lockPasswordInput.value = '';
    lockError.classList.add('hidden');
    setTimeout(()=>lockPasswordInput.focus(), 50);
  }
  function attemptUnlock(){
    const value = lockPasswordInput.value.trim();
    if(value && value === SITE_PASSWORD){
      lockError.classList.add('hidden');
      unlock();
    } else {
      lockError.classList.remove('hidden');
      lockPanel.classList.remove('shake');
      void lockPanel.offsetWidth;
      lockPanel.classList.add('shake');
      lockPasswordInput.value = '';
      lockPasswordInput.focus();
    }
  }
  if(isUnlocked()){
    lockOverlay.classList.add('hidden');
  } else {
    setTimeout(()=>lockPasswordInput.focus(), 100);
  }
  lockSubmitBtn.addEventListener('click', attemptUnlock);
  lockPasswordInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') attemptUnlock(); });
  document.getElementById('relockBtn').addEventListener('click', relock);

  document.getElementById('adminLoginBtn').addEventListener('click', async ()=>{
    if(!auth){ alert('Firebase 설정이 완료되지 않았습니다.'); return; }
    try{
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);
    }catch(err){
      if(err && (err.code==='auth/popup-closed-by-user' || err.code==='auth/cancelled-popup-request')) return;
      alert('로그인에 실패했습니다.\n' + (err && err.message ? err.message : err));
    }
  });
  document.getElementById('adminLogoutBtn').addEventListener('click', async ()=>{
    if(!auth) return;
    try{ await signOut(auth); }catch(err){}
  });

  /* =========================================================================
     Firebase 설정
     ------------------------------------------------------------------------
     아래 firebaseConfig 값을 본인의 Firebase 프로젝트 설정으로 바꿔주세요.
     (Firebase 콘솔 > 프로젝트 설정 > 내 앱 에서 확인할 수 있습니다.)
  ========================================================================= */
  const firebaseConfig = {
    apiKey: "AIzaSyBS2xSA0C1bUwQD-Cb2edwEpq5VcITZNnE",
    authDomain: "math-portfolio-ac7b2.firebaseapp.com",
    projectId: "math-portfolio-ac7b2",
    storageBucket: "math-portfolio-ac7b2.firebasestorage.app",
    messagingSenderId: "887961048342",
    appId: "1:887961048342:web:b34bc7504c8f915ad3ac37"
  };

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import {
    getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
    onSnapshot, query, where, getDocs
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
  import {
    getStorage, ref, uploadString, getDownloadURL, deleteObject
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-storage.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

  /* 이 계정으로 Google 로그인했을 때만 "관리자"가 되어 사진 추가/수정/삭제 등을
     쓰기 작업을 할 수 있어요. 다른 사람은 로그인 없이도 보기만 가능해요. */
  const ADMIN_EMAIL = 'felicityshout@gmail.com';

  let app, db, storage, auth;
  let firebaseReady = false;
  let isAdmin = false;

  function showSetupBanner(html){
    const el = document.getElementById('setupBanner');
    el.innerHTML = html;
    el.classList.remove('hidden');
  }
  function hideSetupBanner(){
    document.getElementById('setupBanner').classList.add('hidden');
  }

  function initFirebase(){
    if(!firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('여기에') !== -1){
      showSetupBanner('⚠️ 아직 Firebase 설정이 완료되지 않았어요. 안내에 따라 이 파일 위쪽의 <code>firebaseConfig</code> 값을 채워주세요.');
      return;
    }
    try{
      app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      storage = getStorage(app);
      auth = getAuth(app);
      firebaseReady = true;
      subscribeYearsAndLectures();
      onAuthStateChanged(auth, async (user)=>{
        if(user && user.email !== ADMIN_EMAIL){
          // Someone signed in with a Google account that isn't the admin's — kick them back out.
          isAdmin = false;
          try{ await signOut(auth); }catch(e){}
          updateAdminUI();
          alert('관리자 계정(' + ADMIN_EMAIL + ')으로만 로그인할 수 있어요.');
          return;
        }
        isAdmin = !!user;
        updateAdminUI();
        render();
        renderSidebar();
      });
    }catch(err){
      showSetupBanner('⚠️ Firebase 초기화에 실패했습니다: ' + err.message);
    }
  }

  function ensureReady(){
    if(!firebaseReady) throw new Error('Firebase 설정이 완료되지 않았습니다. 안내를 참고해 설정을 마쳐주세요.');
    if(!isAdmin) throw new Error('관리자로 로그인해야 수정할 수 있어요. 오른쪽 위 "관리자 로그인" 버튼을 눌러주세요.');
  }

  /* ---------------- Admin login (Google) ---------------- */
  function updateAdminUI(){
    document.body.classList.toggle('admin-mode', isAdmin);
    const loginBtn = document.getElementById('adminLoginBtn');
    const logoutBtn = document.getElementById('adminLogoutBtn');
    const statusLabel = document.getElementById('adminStatusLabel');
    if(!loginBtn || !logoutBtn || !statusLabel) return;
    loginBtn.classList.toggle('hidden', isAdmin);
    logoutBtn.classList.toggle('hidden', !isAdmin);
    statusLabel.classList.toggle('hidden', !isAdmin);
  }

  /* ---------------- id helper (no crypto.randomUUID dependency) ---------------- */
  function genId(){
    return 'img_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,10);
  }

  /* ---------------- Remote data layer ---------------- */
  async function addYear(name){
    ensureReady();
    await addDoc(collection(db,'years'), { name, createdAt: Date.now(), order: Date.now() });
  }
  async function addLecture(yearId, name){
    ensureReady();
    await addDoc(collection(db,'lectures'), { yearId, name, createdAt: Date.now(), order: Date.now() });
  }
  async function addSession(lectureId, name){
    ensureReady();
    await addDoc(collection(db,'sessions'), { lectureId, name, createdAt: Date.now(), order: Date.now() });
  }
  async function updateOrder(collectionName, id, order){
    ensureReady();
    await updateDoc(doc(db, collectionName, id), { order });
  }
  async function addList(sessionId, name){
    ensureReady();
    await addDoc(collection(db,'lists'), { sessionId, name, createdAt: Date.now(), order: Date.now() });
  }
  async function renameList(listId, name){
    ensureReady();
    await updateDoc(doc(db,'lists', listId), { name });
  }
  async function deleteListsOfSession(sessionId){
    const snap = await getDocs(query(collection(db,'lists'), where('sessionId','==', sessionId)));
    for(const d of snap.docs){ await deleteDoc(doc(db,'lists', d.id)); }
  }
  async function deleteListCascade(list){
    ensureReady();
    // Posts inside the list are kept — just unassigned to "미분류" — only the list itself is removed.
    const listPosts = posts.filter(p=>p.listId===list.id);
    for(const p of listPosts){
      await updateDoc(doc(db,'posts', p.id), { listId: null });
    }
    await deleteDoc(doc(db,'lists', list.id));
  }
  async function movePostToList(postId, listId, order){
    ensureReady();
    await updateDoc(doc(db,'posts', postId), { listId: listId || null, order });
  }
  async function renameYear(yearId, name){
    ensureReady();
    await updateDoc(doc(db,'years', yearId), { name });
  }
  async function renameLecture(lectureId, name){
    ensureReady();
    await updateDoc(doc(db,'lectures', lectureId), { name });
  }
  async function renameSession(sessionId, name){
    ensureReady();
    await updateDoc(doc(db,'sessions', sessionId), { name });
  }
  async function deletePostsOfSession(sessionId){
    const snap = await getDocs(query(collection(db,'posts'), where('sessionId','==', sessionId)));
    for(const d of snap.docs){
      const data = d.data();
      if(data.storagePath){
        try{ await deleteObject(ref(storage, data.storagePath)); }catch(e){ /* already gone */ }
      }
      await deleteDoc(doc(db,'posts', d.id));
    }
  }
  async function deleteSessionCascade(session){
    ensureReady();
    await deletePostsOfSession(session.id);
    await deleteListsOfSession(session.id);
    await deleteDoc(doc(db,'sessions', session.id));
    if(selectedSessionId === session.id) selectSession(null);
  }
  async function deleteLectureCascade(lecture){
    ensureReady();
    const lectureSessions = sessions.filter(s=>s.lectureId===lecture.id);
    for(const s of lectureSessions){
      await deletePostsOfSession(s.id);
      await deleteListsOfSession(s.id);
      await deleteDoc(doc(db,'sessions', s.id));
      if(selectedSessionId === s.id) selectSession(null);
    }
    await deleteDoc(doc(db,'lectures', lecture.id));
  }
  async function deleteYearCascade(year){
    ensureReady();
    const yearLectures = lectures.filter(l=>l.yearId===year.id);
    for(const lec of yearLectures){
      const lectureSessions = sessions.filter(s=>s.lectureId===lec.id);
      for(const s of lectureSessions){
        await deletePostsOfSession(s.id);
        await deleteListsOfSession(s.id);
        await deleteDoc(doc(db,'sessions', s.id));
        if(selectedSessionId === s.id) selectSession(null);
      }
      await deleteDoc(doc(db,'lectures', lec.id));
    }
    await deleteDoc(doc(db,'years', year.id));
  }

  async function remoteCreatePost({title, answer, imageDataURL, listId}){
    ensureReady();
    if(!selectedSessionId) throw new Error('수업이 선택되지 않았습니다.');
    const storagePath = `posts/${genId()}.jpg`;
    const sRef = ref(storage, storagePath);
    await uploadString(sRef, imageDataURL, 'data_url');
    const imageURL = await getDownloadURL(sRef);
    await addDoc(collection(db,'posts'), {
      sessionId: selectedSessionId, listId: listId || null, title, answer, image: imageURL, storagePath, createdAt: Date.now(), order: Date.now()
    });
  }
  async function remoteUpdatePostFields(id, changes){
    ensureReady();
    await updateDoc(doc(db,'posts', id), changes);
  }
  async function remoteUpdatePostImage(post, newDataURL){
    ensureReady();
    const sRef = ref(storage, post.storagePath);
    await uploadString(sRef, newDataURL, 'data_url');
    const imageURL = await getDownloadURL(sRef);
    await updateDoc(doc(db,'posts', post.id), { image: imageURL });
  }
  async function remoteDeletePost(post){
    ensureReady();
    if(post.storagePath){
      try{ await deleteObject(ref(storage, post.storagePath)); }catch(e){ /* already gone */ }
    }
    await deleteDoc(doc(db,'posts', post.id));
  }

  /* ---------------- State ---------------- */
  let years = [];
  let lectures = [];
  let sessions = [];
  let posts = [];
  let lists = [];
  let selectedSessionId = null;
  try{ selectedSessionId = localStorage.getItem('selectedSessionId') || null; }catch(e){}
  let unsubscribePosts = null;
  let unsubscribeLists = null;
  let restoredSelection = false;

  function subscribeYearsAndLectures(){
    onSnapshot(collection(db,'years'), snap=>{
      years = snap.docs.map(d=>({id:d.id, ...d.data()}));
      renderSidebar();
      updateBoardHeader();
      hideSetupBanner();
    }, err=>{ showSetupBanner('⚠️ 연도 목록을 불러오지 못했습니다: ' + err.message); });

    onSnapshot(collection(db,'lectures'), snap=>{
      lectures = snap.docs.map(d=>({id:d.id, ...d.data()}));
      renderSidebar();
      updateBoardHeader();
    }, err=>{ showSetupBanner('⚠️ 강의 목록을 불러오지 못했습니다: ' + err.message); });

    onSnapshot(collection(db,'sessions'), snap=>{
      sessions = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(!restoredSelection){
        restoredSelection = true;
        if(selectedSessionId && sessions.some(s=>s.id===selectedSessionId)){
          selectSession(selectedSessionId);
        }
      }
      renderSidebar();
      updateBoardHeader();
    }, err=>{ showSetupBanner('⚠️ 수업 목록을 불러오지 못했습니다: ' + err.message); });
  }

  function selectSession(sessionId){
    selectedSessionId = sessionId;
    try{ localStorage.setItem('selectedSessionId', sessionId || ''); }catch(e){}
    if(unsubscribePosts){ unsubscribePosts(); unsubscribePosts = null; }
    if(unsubscribeLists){ unsubscribeLists(); unsubscribeLists = null; }
    posts = [];
    lists = [];
    if(!sessionId){
      updateBoardHeader();
      render();
      renderSidebar();
      return;
    }
    const q = query(collection(db,'posts'), where('sessionId','==', sessionId));
    unsubscribePosts = onSnapshot(q, snap=>{
      posts = snap.docs.map(d=>({id:d.id, ...d.data()}));
      posts.sort((a,b)=>(a.order ?? a.createdAt ?? 0)-(b.order ?? b.createdAt ?? 0));
      render();
    }, err=>{ showSetupBanner('⚠️ 게시물을 불러오지 못했습니다: ' + err.message); });
    const lq = query(collection(db,'lists'), where('sessionId','==', sessionId));
    unsubscribeLists = onSnapshot(lq, snap=>{
      lists = snap.docs.map(d=>({id:d.id, ...d.data()}));
      lists.sort((a,b)=>(a.order ?? a.createdAt ?? 0)-(b.order ?? b.createdAt ?? 0));
      render();
    }, err=>{ showSetupBanner('⚠️ 목록을 불러오지 못했습니다: ' + err.message); });
    updateBoardHeader();
    renderSidebar();
  }

  function updateBoardHeader(){
    const boardTitle = document.getElementById('boardTitle');
    const boardSubtitle = document.getElementById('boardSubtitle');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    if(!selectedSessionId){
      boardTitle.textContent = '📚 문제풀이 공유 보드';
      boardSubtitle.textContent = '왼쪽에서 수업을 선택하거나 새로 만들어보세요.';
      clearAllBtn.disabled = true;
      downloadAllBtn.disabled = true;
      return;
    }
    const session = sessions.find(s=>s.id===selectedSessionId);
    const lecture = session ? lectures.find(l=>l.id===session.lectureId) : null;
    const year = lecture ? years.find(y=>y.id===lecture.yearId) : null;
    if(session){
      const path = [year?year.name:null, lecture?lecture.name:null, session.name].filter(Boolean).join(' · ');
      boardTitle.textContent = `📚 ${path}`;
      boardSubtitle.textContent = '사진을 올리고, 함께 풀이를 확인해보세요 — 로그인 없이 바로 사용할 수 있어요.';
    }
    clearAllBtn.disabled = posts.length===0;
    downloadAllBtn.disabled = posts.length===0;
  }

  /* ---------------- Sidebar rendering ---------------- */
  function renderSidebar(){
    const tree = document.getElementById('yearTree');
    if(years.length===0){
      tree.innerHTML = `<div class="empty-tree-hint">아직 연도가 없어요.<br>"+ 연도" 버튼으로 추가해보세요.</div>`;
      return;
    }
    const byOrder = (a,b)=>(a.order ?? a.createdAt ?? 0)-(b.order ?? b.createdAt ?? 0);
    const sortedYears = [...years].sort(byOrder);
    tree.innerHTML = sortedYears.map(y=>{
      const yearLectures = lectures.filter(l=>l.yearId===y.id).sort(byOrder);
      const lecturesHTML = yearLectures.length
        ? yearLectures.map(l=>{
            const lectureSessions = sessions.filter(s=>s.lectureId===l.id).sort(byOrder);
            const sessionsHTML = lectureSessions.length
              ? lectureSessions.map(s=>`

  yearTreeEl.addEventListener('dragover', (e)=>{

      const draggedSession = sessions.find(s=>s.id===treeDragId);

      if(!draggedSession || draggedSession.lectureId !== targetLectureId) return;

      const targetYearId = targetRow.closest('.year-block').dataset.yearId;
      if(!draggedLecture || draggedLecture.yearId !== targetYearId) return;

    if(!treeDragType) return;
    const targetRow = findTreeRow(e.target, treeDragType);
    if(!targetRow) return;
    e.preventDefault();
    targetRow.classList.remove('drag-over');

    let targetId, siblings, collectionName;
    if(treeDragType==='session'){
      targetId = targetRow.dataset.sessionId;
      const draggedSession = sessions.find(s=>s.id===treeDragId);
      const targetLectureId = targetRow.closest('.lecture-block').dataset.lectureId;
      if(!draggedSession || draggedSession.lectureId !== targetLectureId) return;
      siblings = sessions.filter(s=>s.lectureId===targetLectureId).sort((a,b)=>(a.order??a.createdAt??0)-(b.order??b.createdAt??0));
      collectionName = 'sessions';
    } else if(treeDragType==='lecture'){
      targetId = targetRow.closest('.lecture-block').dataset.lectureId;
      const draggedLecture = lectures.find(l=>l.id===treeDragId);
      const targetYearId = targetRow.closest('.year-block').dataset.yearId;

      siblings = lectures.filter(l=>l.yearId===targetYearId).sort((a,b)=>(a.order??a.createdAt??0)-(b.order??b.createdAt??0));
      collectionName = 'lectures';
    } else {
      targetId = targetRow.closest('.year-block').dataset.yearId;
      siblings = [...years].sort((a,b)=>(a.order??a.createdAt??0)-(b.order??b.createdAt??0));
      collectionName = 'years';
    }
    if(targetId === treeDragId) return;

    const fromIndex = siblings.findIndex(x=>x.id===treeDragId);
    const toIndex = siblings.findIndex(x=>x.id===targetId);
    if(fromIndex===-1 || toIndex===-1) return;
    const [moved] = siblings.splice(fromIndex,1);

  });

  function escapeHTML(str){

  function cloneCanvas(src){
    const c = document.createElement('canvas');
    c.width = src.width; c.height = src.height;
    c.getContext('2d').drawImage(src,0,0);
    return c;
  }
  function applyScannerEffect(ctx, canvasLike){
    const w = canvasLike.width, h = canvasLike.height;
    const imageData = ctx.getImageData(0,0,w,h);
    const data = imageData.data;
    let min=255, max=0;
    const gray = new Float32Array(w*h);
    for(let i=0;i<data.length;i+=4){
      const g = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
      gray[i/4]=g;
      if(g<min) min=g;
      if(g>max) max=g;
    }
    const MIN_RANGE = 40;
    const range = Math.max(max-min, MIN_RANGE);
    for(let i=0;i<data.length;i+=4){
      let v = (gray[i/4]-min)/range*255;
      v = v<0?0:(v>255?255:v);
      v = 255*Math.pow(v/255, 0.75);
      data[i]=data[i+1]=data[i+2]=v;
    }
    ctx.putImageData(imageData,0,0);
  }
  function applyBrightnessContrast(ctx, w, h, baseData, brightness, contrast){
    const imageData = ctx.createImageData(w,h);
    const data = imageData.data;
    const c = contrast/100;
    for(let i=0;i<baseData.length;i+=4){
      for(let ch=0; ch<3; ch++){
        let v = (baseData[i+ch]-128)*c + 128 + brightness;
        data[i+ch] = v<0?0:(v>255?255:v);
      }
      data[i+3]=baseData[i+3];
    }
    ctx.putImageData(imageData,0,0);
  }
  function loadFileToCanvas(file){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          const MAX=1600;
          let w=img.width, h=img.height;
          const scale = Math.min(1, MAX/Math.max(w,h));
          w = Math.round(w*scale); h = Math.round(h*scale);
          const canvas = document.createElement('canvas');
          canvas.width=w; canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas);
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  function dataURLToImage(dataURL){
    return new Promise((resolve,reject)=>{
      const img = new Image();
      // Photos loaded here can be a remote Firebase Storage URL (cross-origin)
      // or a local data: URL. crossOrigin='anonymous' asks the browser to make
      // a CORS request when it's remote, so the canvas we draw it into isn't
      // "tainted" and pixel operations (scan effect, brightness/contrast,
      // drawing, saving edits) keep working — this only succeeds if the
      // Storage bucket has CORS enabled, but is harmless for data: URLs.
      img.crossOrigin = 'anonymous';
      img.onload = ()=>resolve(img);
      img.onerror = reject;
      img.src = dataURL;
    });
  }

      const fromIndex = lists.findIndex(l=>l.id===listDragId);
      const toIndex = lists.findIndex(l=>l.id===targetListId);
      if(fromIndex===-1 || toIndex===-1) return;

  /* ---------------- Download all images (current session) as ZIP ---------------- */
  function sanitizeFilename(name){
    return (name || '').replace(/[\\/:*?"<>|]/g, '_').trim().slice(0, 60);
  }
  // Chromium (and other browsers) silently discard non-ASCII characters in the
  // `download` attribute for blob: URLs, falling back to a generic "download"
  // filename. Korean lecture/session names would trip this, so the outer ZIP
  // filename is built from ASCII-only fragments (+ a timestamp for uniqueness).
  // Per-image filenames *inside* the ZIP are unaffected by this bug and keep
  // full Korean text via sanitizeFilename above.
  function asciiSafeFragment(name){
    return (name || '').replace(/[^\x20-\x7E]/g, '').replace(/[\\/:*?"<>|]/g, '_').trim();
  }
  function timestampTag(){
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
  }

  document.getElementById('downloadAllBtn').addEventListener('click', async ()=>{
    if(!selectedSessionId || posts.length===0) return;
    const btn = document.getElementById('downloadAllBtn');
    const originalLabel = btn.textContent;
    btn.disabled = true;

    const session = sessions.find(s=>s.id===selectedSessionId);
    const lecture = session ? lectures.find(l=>l.id===session.lectureId) : null;
    const year = lecture ? years.find(y=>y.id===lecture.yearId) : null;
    const asciiParts = [year?.name, lecture?.name, session?.name]
      .map(asciiSafeFragment).filter(Boolean);
    const zipName = (asciiParts.length ? asciiParts.join('_').replace(/\s+/g,'_') + '_' : 'problem-board_') + timestampTag();

    try{
      const zip = new JSZip();
      let successCount = 0;
      let failCount = 0;

      for(let i=0; i<posts.length; i++){
        const p = posts[i];
        btn.textContent = `다운로드 준비 중... (${i+1}/${posts.length})`;
        try{
          const res = await fetch(p.image);
          if(!res.ok) throw new Error('HTTP ' + res.status);
          const blob = await res.blob();
          const baseName = sanitizeFilename(p.title) || `사진${i+1}`;
          let ext = 'jpg';
          const typeMatch = /image\/(\w+)/.exec(blob.type || '');
          if(typeMatch) ext = typeMatch[1] === 'jpeg' ? 'jpg' : typeMatch[1];
          zip.file(`${String(i+1).padStart(2,'0')}_${baseName}.${ext}`, blob);
          successCount++;
        }catch(err){
          console.error('이미지 다운로드 실패:', p.id, err);
          failCount++;
        }
      }

      if(successCount===0){
        alert('이미지를 하나도 받아오지 못했습니다.\n\nFirebase Storage 버킷에 CORS 설정이 되어있지 않으면 이 기능이 작동하지 않을 수 있습니다.\n(Google Cloud Console → Storage → 버킷 → 구성(Configuration) 탭에서 CORS를 설정해야 합니다.)');
        return;
      }

      btn.textContent = '압축 중...';
      const content = await zip.generateAsync({type:'blob'});
      const url = URL.createObjectURL(content);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${zipName}.zip`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);

      if(failCount>0){
        alert(`${successCount}개 이미지는 다운로드했지만, ${failCount}개는 실패했습니다.\n\nFirebase Storage 버킷의 CORS 설정을 확인해보세요.`);
      }
    }catch(err){
      alert('다운로드 중 오류가 발생했습니다.\n' + err.message);
    } finally {
      btn.disabled = posts.length===0;
      btn.textContent = originalLabel;
    }
  });

  const lightboxOverlay = document.getElementById('lightboxOverlay');
  const lbViewport = document.getElementById('lbViewport');

  const stageCtx = stageCanvas.getContext('2d', {willReadFrequently:true});
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomResetBtn = document.getElementById('zoomResetBtn');

  let currentId = null;
  let origAtOpen = null;
  let scale=1, tx=0, ty=0;
  let mode = 'view';
  let history = [];
  let baseImageData = null;
  // Offscreen mirror of the last "committed" canvas state (right after the
  // photo loads, or after rotate/scan-effect/a finished pen or eraser
  // stroke). The eraser restores original pixels by copying from this
  // canvas back onto the visible one — a canvas-to-canvas drawImage never
  // needs to read pixel data into JS, so unlike getImageData it keeps
  // working even when the stage canvas is CORS-tainted.
  const baseCanvas = document.createElement('canvas');
  const baseCtx = baseCanvas.getContext('2d');
  function syncBaseCanvas(){
    baseCanvas.width = stageCanvas.width;
    baseCanvas.height = stageCanvas.height;
    baseCtx.clearRect(0,0,baseCanvas.width,baseCanvas.height);
    baseCtx.drawImage(stageCanvas,0,0);
  }
  let currentPenColor = '#ff3b3b';
  let currentPenWidth = 5;
  let isDrawing=false, lastPt=null;
  let dragging=false, dragStart={x:0,y:0}, dragOrigin={x:0,y:0};
  let bcHistoryPushed=false;
  // Photos are loaded from a cross-origin Firebase Storage URL. Unless the
  // Storage bucket has CORS configured to allow this site's origin, the
  // canvas becomes "tainted" once we draw the image onto it — pixel-level
  // operations (getImageData/toDataURL, needed for scan effect, brightness/
  // contrast, drawing, and saving edits) then throw a SecurityError, even
  // though plain viewing/zooming/panning (which never reads pixel data)
  // works fine. These helpers make that failure graceful instead of silently
  // breaking the whole lightbox.
  let canvasTainted = false;
  let corsWarnedThisOpen = false;
  function safeGetImageData(){
    try{
      return stageCtx.getImageData(0,0,stageCanvas.width, stageCanvas.height).data.slice();
    }catch(err){
      canvasTainted = true;
      return null;
    }
  }
  function warnCorsIfNeeded(){
    if(!canvasTainted || corsWarnedThisOpen) return;
    corsWarnedThisOpen = true;
    alert('이 사진은 지금 편집(스캔 효과 / 밝기·대비 / 그리기 / 저장) 기능을 쓸 수 없어요.\n\n사진 보기·확대·축소는 정상적으로 되지만, 편집 기능을 쓰려면 Firebase Storage 버킷에 CORS 설정이 필요합니다.');
  }

  function applyTransform(){
    stageCanvas.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  }
  function pushHistory(){
    try{
      history.push(stageCanvas.toDataURL('image/jpeg',0.92));
      if(history.length>15) history.shift();
    }catch(err){
      canvasTainted = true;
    }
  }
  async function drawDataURLToStage(dataURL){
    const img = await dataURLToImage(dataURL);
    stageCanvas.width = img.width;
    stageCanvas.height = img.height;
    stageCtx.clearRect(0,0,stageCanvas.width,stageCanvas.height);

    baseImageData = safeGetImageData();

  async function openLightbox(id){
    const post = posts.find(p=>p.id===id);
    if(!post) return;
    currentId = id;

  zoomInBtn.addEventListener('click', ()=>{ scale=Math.min(4, scale+0.25); applyTransform(); });
  zoomOutBtn.addEventListener('click', ()=>{ scale=Math.max(0.5, scale-0.25); applyTransform(); });
  zoomResetBtn.addEventListener('click', ()=>{ scale=1; tx=0; ty=0; applyTransform(); });
  lbViewport.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const delta = e.deltaY<0 ? 0.12 : -0.12;
    scale = Math.min(4, Math.max(0.5, scale+delta));
    applyTransform();
  }, {passive:false});

  function getCanvasCoords(e){
    const rect = stageCanvas.getBoundingClientRect();
    const scaleX = stageCanvas.width/rect.width;
    const scaleY = stageCanvas.height/rect.height;
    return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
  }
  // Erasing restores original pixels by copying (canvas-to-canvas, never
  // reading pixel data) a circular patch from baseCanvas back onto the
  // visible stage — so it removes only marks drawn since the last
  // checkpoint (load / rotate / scan effect / a previous finished stroke),
  // the same way the pen only adds marks since that checkpoint.
  function eraseAt(pt, radius){
    stageCtx.save();
    stageCtx.beginPath();
    stageCtx.arc(pt.x, pt.y, radius, 0, Math.PI*2);
    stageCtx.clip();
    stageCtx.drawImage(baseCanvas, 0, 0);
    stageCtx.restore();
  }
  function eraseSegment(p0, p1, radius){
    const dist = Math.hypot(p1.x-p0.x, p1.y-p0.y);
    const steps = Math.max(1, Math.ceil(dist/Math.max(radius/2,1)));
    for(let i=0;i<=steps;i++){
      const t = i/steps;
      eraseAt({x:p0.x+(p1.x-p0.x)*t, y:p0.y+(p1.y-p0.y)*t}, radius);
    }
  }
  stageCanvas.addEventListener('pointerdown', (e)=>{
    if(mode==='draw' || mode==='erase'){
      pushHistory();
      isDrawing=true;
      lastPt = getCanvasCoords(e);
      stageCanvas.setPointerCapture(e.pointerId);
      if(mode==='erase') eraseAt(lastPt, currentPenWidth);
      return;
    }
    dragging=true;
    dragStart={x:e.clientX,y:e.clientY};
    dragOrigin={x:tx,y:ty};
    stageCanvas.classList.add('dragging');
    stageCanvas.setPointerCapture(e.pointerId);
  });
  stageCanvas.addEventListener('pointermove', (e)=>{
    if(mode==='draw'){
      if(!isDrawing) return;
      const pt = getCanvasCoords(e);
      stageCtx.strokeStyle=currentPenColor;
      stageCtx.lineWidth=currentPenWidth;
      stageCtx.lineCap='round'; stageCtx.lineJoin='round';
      stageCtx.beginPath();
      stageCtx.moveTo(lastPt.x,lastPt.y);
      stageCtx.lineTo(pt.x,pt.y);
      stageCtx.stroke();
      lastPt=pt;
      return;
    }
    if(mode==='erase'){
      if(!isDrawing) return;
      const pt = getCanvasCoords(e);
      eraseSegment(lastPt, pt, currentPenWidth);
      lastPt=pt;
      return;
    }
    if(!dragging) return;
    tx = dragOrigin.x + (e.clientX-dragStart.x);
    ty = dragOrigin.y + (e.clientY-dragStart.y);
    applyTransform();
  });
  function endInteraction(){
    if((mode==='draw' || mode==='erase') && isDrawing){
      isDrawing=false;
      // Note: baseCanvas (the eraser's restore target) is deliberately NOT
      // re-synced here — it should keep reflecting the clean photo from the
      // last real checkpoint (load/rotate/scan effect/brightness bake) so
      // the eraser can always reveal it, no matter how many pen strokes
      // were drawn on top since. baseImageData (for the brightness/contrast
      // preview) is a separate thing and does need to include the drawing.
      baseImageData = safeGetImageData();
      warnCorsIfNeeded();
    }
    dragging=false;
    stageCanvas.classList.remove('dragging');
  }
  stageCanvas.addEventListener('pointerup', endInteraction);
  stageCanvas.addEventListener('pointerleave', ()=>{ if(mode!=='draw' && mode!=='erase') dragging=false; stageCanvas.classList.remove('dragging'); });

  drawModeBtn.addEventListener('click', ()=>{

  penWidthSlider.addEventListener('input', ()=>{ currentPenWidth = Number(penWidthSlider.value); });

  function rotateStage(dir){
    pushHistory();
    const w = stageCanvas.width, h = stageCanvas.height;
    const newCanvas = document.createElement('canvas');
    newCanvas.width = h; newCanvas.height = w;
    const nctx = newCanvas.getContext('2d');
    if(dir===1){ nctx.translate(h,0); nctx.rotate(Math.PI/2); }
    else { nctx.translate(0,w); nctx.rotate(-Math.PI/2); }
    nctx.drawImage(stageCanvas,0,0);
    stageCanvas.width = newCanvas.width;
    stageCanvas.height = newCanvas.height;
    stageCtx.clearRect(0,0,stageCanvas.width,stageCanvas.height);
    stageCtx.drawImage(newCanvas,0,0);
    baseImageData = safeGetImageData();
    syncBaseCanvas();
    warnCorsIfNeeded();
    resetSliders();
  }
  rotateLeftBtn.addEventListener('click', ()=>rotateStage(-1));
  rotateRightBtn.addEventListener('click', ()=>rotateStage(1));

  scanEffectBtn.addEventListener('click', ()=>{
    pushHistory();
    try{
      applyScannerEffect(stageCtx, stageCanvas);
    }catch(err){
      canvasTainted = true;
      warnCorsIfNeeded();
      return;
    }
    baseImageData = safeGetImageData();
    syncBaseCanvas();
    resetSliders();
  });

  function onBCInput(){
    if(!baseImageData){ warnCorsIfNeeded(); return; }
    applyBrightnessContrast(stageCtx, stageCanvas.width, stageCanvas.height, baseImageData, Number(brightnessSlider.value), Number(contrastSlider.value));
  }
  function armBCHistory(){ if(!bcHistoryPushed){ pushHistory(); bcHistoryPushed=true; } }
  brightnessSlider.addEventListener('pointerdown', armBCHistory);
  contrastSlider.addEventListener('pointerdown', armBCHistory);
  brightnessSlider.addEventListener('input', onBCInput);
  contrastSlider.addEventListener('input', onBCInput);
  function bakeBC(){
    if(!bcHistoryPushed) return;
    baseImageData = safeGetImageData();
    syncBaseCanvas();
    warnCorsIfNeeded();
    brightnessSlider.value=0; contrastSlider.value=100;
    bcHistoryPushed=false;
  }
  brightnessSlider.addEventListener('change', bakeBC);
  contrastSlider.addEventListener('change', bakeBC);

  undoBtn.addEventListener('click', async ()=>{
    if(!history.length) return;
    const prev = history.pop();
    await drawDataURLToStage(prev);
  });
  resetOrigBtn.addEventListener('click', async ()=>{
    pushHistory();
    await drawDataURLToStage(origAtOpen);
  });

  saveEditBtn.addEventListener('click', async ()=>{
    if(currentId==null) return;
    const post = posts.find(p=>p.id===currentId);
    if(!post) return;
    let dataURL;
    try{
      dataURL = stageCanvas.toDataURL('image/jpeg',0.9);
    }catch(err){
      canvasTainted = true;
      warnCorsIfNeeded();
      return;
    }
    saveEditBtn.disabled = true;
    saveEditBtn.textContent = '저장 중...';
    try{
      await remoteUpdatePostImage(post, dataURL);
      closeLightbox();
    }catch(err){
      alert('저장에 실패했습니다.\n' + err.message);
    }finally{
      saveEditBtn.disabled = false;
      saveEditBtn.textContent = '💾 저장';
    }
  });
  deletePostBtn.addEventListener('click', async ()=>{
    if(currentId==null) return;
    if(!confirm('이 게시물을 삭제할까요?')) return;
    const post = posts.find(p=>p.id===currentId);
    if(!post) return;
    try{
      await remoteDeletePost(post);
      closeLightbox();
    }catch(err){
      alert('삭제에 실패했습니다.\n' + err.message);
    }
  });

  /* ---------------- Init ---------------- */
  render();
  renderSidebar();
  initFirebase();
</script>
</body>
</html>
